<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Professional Dashboard</title>
  </head>
  <body>
    <!-- تغيير div إلى aside ليكون دلالياً أصح للقائمة الجانبية -->
    <aside class="menu">
      <ul>
        <li class="profile">
          <div class="img-box">
            <img
              src="img/WhatsApp Image 2026-09-13 at 1.46.58 PM.jpeg"
              alt="profile"
            />
          </div>
          <h2>Adeep Yahia</h2>
        </li>
        <li>
          <a class="active" href="#">
            <i class="fas fa-home"></i>
            <p>Dashboard</p>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-user-group"></i>
            <p>Clients</p>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-table"></i>
            <p>Products</p>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-chart-pie"></i>
            <p>Charts</p>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-star"></i>
            <p>Favorite</p>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-cog"></i>
            <p>Settings</p>
          </a>
        </li>
        <!-- زر تسجيل الخروج -->
        <li class="log-out">
          <a href="#">
            <i class="fas fa-sign-out-alt"></i>
            <p>Log out</p>
          </a>
        </li>
      </ul>
    </aside>

    <!-- تغيير div إلى main ليدل على المحتوى الرئيسي -->
    <main class="content">
      <div class="title-info">
        <p>Dashboard</p>
        <i class="fas fa-chart-bar"></i>
      </div>

      <div class="data-info">
        <div class="box">
          <i class="fas fa-user"></i>
          <div class="data">
            <p>Users</p>
            <span>100</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-pen"></i>
          <div class="data">
            <p>Posts</p>
            <span>758</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-table"></i>
          <div class="data">
            <p>Products</p>
            <span>34</span>
          </div>
        </div>
        <div class="box">
          <i class="fas fa-dollar-sign"></i>
          <div class="data">
            <p>Revenue</p>
            <span>126$</span>
          </div>
        </div>
      </div>

      <div class="title-info">
        <p>Products</p>
        <i class="fas fa-table"></i>
      </div>

      <!-- وضع الجدول داخل حاوية لسهولة التمرير في الجوال -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th>Count</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>TV</td>
              <td><span class="price">142$</span></td>
              <td><span class="count">654</span></td>
            </tr>
            <tr>
              <td>Phone</td>
              <td><span class="price">142$</span></td>
              <td><span class="count">654</span></td>
            </tr>
            <tr>
              <td>TV</td>
              <td><span class="price">142$</span></td>
              <td><span class="count">654</span></td>
            </tr>
            <tr>
              <td>TV</td>
              <td><span class="price">142$</span></td>
              <td><span class="count">654</span></td>
            </tr>
            <tr>
              <td>TV</td>
              <td><span class="price">142$</span></td>
              <td><span class="count">654</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
